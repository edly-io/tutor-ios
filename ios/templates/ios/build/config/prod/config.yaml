# Open edX iOS app configuration, generated by the tutor-ios plugin.
#
# This file is merged by config_script/process_config.py into the app's
# config.plist at build time. The keys below mirror those read by
# Core/Core/Configuration/Config/*.swift in openedx-app-ios.
API_HOST_URL: "{{ "https" if ENABLE_HTTPS else "http" }}://{{ LMS_HOST }}"
SSO_URL: "{{ IOS_SSO_URL }}"
SSO_FINISHED_URL: "{{ IOS_SSO_FINISHED_URL }}"
ENVIRONMENT_DISPLAY_NAME: "{{ IOS_ENVIRONMENT_DISPLAY_NAME }}"
PLATFORM_NAME: "{{ PLATFORM_NAME }}"
ORGANIZATION_CODE: "{{ IOS_ORGANIZATION_CODE }}"
FEEDBACK_EMAIL_ADDRESS: "{{ IOS_FEEDBACK_EMAIL_ADDRESS }}"
OAUTH_CLIENT_ID: "{{ IOS_OAUTH_CLIENT_ID }}"
# tokenType accepts JWT and BEARER only
TOKEN_TYPE: "{{ IOS_TOKEN_TYPE }}"
FAQ_URL: "{{ IOS_FAQ_URL }}"
URI_SCHEME: "{{ IOS_URI_SCHEME }}"
APP_STORE_ID: "{{ IOS_APP_STORE_ID }}"

# Title of the SSO sign-in button, keyed by language code.
SSO_BUTTON_TITLE:
{% for code, title in IOS_SSO_BUTTON_TITLE.items() %}
    {{ code }}: "{{ title }}"
{% endfor %}

# Keep a URL empty to hide the corresponding setting in the app.
AGREEMENT_URLS:
  PRIVACY_POLICY_URL: "{{ IOS_PRIVACY_POLICY_URL }}"
  COOKIE_POLICY_URL: "{{ IOS_COOKIE_POLICY_URL }}"
  DATA_SELL_CONSENT_URL: "{{ IOS_DATA_SELL_CONSENT_URL }}"
  TOS_URL: "{{ IOS_TOS_URL }}"
  EULA_URL: "{{ IOS_EULA_URL }}"
  SUPPORTED_LANGUAGES: {{ IOS_SUPPORTED_LANGUAGES }} # en is the default language

# Feature flags read by FeaturesConfig.swift
WHATS_NEW_ENABLED: {{ IOS_WHATS_NEW_ENABLED }}
PRE_LOGIN_EXPERIENCE_ENABLED: {{ IOS_PRE_LOGIN_EXPERIENCE_ENABLED }}
APP_LEVEL_DATES_ENABLED: {{ IOS_APP_LEVEL_DATES_ENABLED }}

UI_COMPONENTS:
  COURSE_DROPDOWN_NAVIGATION_ENABLED: {{ IOS_COURSE_DROPDOWN_NAVIGATION_ENABLED }}
  COURSE_UNIT_PROGRESS_ENABLED: {{ IOS_COURSE_UNIT_PROGRESS_ENABLED }}
  LOGIN_REGISTRATION_ENABLED: {{ IOS_LOGIN_REGISTRATION_ENABLED }}
  SAML_SSO_LOGIN_ENABLED: {{ IOS_SAML_SSO_LOGIN_ENABLED }}
  SAML_SSO_DEFAULT_LOGIN_BUTTON: {{ IOS_SAML_SSO_DEFAULT_LOGIN_BUTTON }}

THEME:
  ROUNDED_CORNERS_STYLE: {{ IOS_ROUNDED_CORNERS_STYLE }}
  BUTTON_CORNERS_RADIUS: {{ IOS_BUTTON_CORNERS_RADIUS }}

EXPERIMENTAL_FEATURES:
  APP_LEVEL_DOWNLOADS:
    ENABLED: {{ IOS_APP_LEVEL_DOWNLOADS_ENABLED }}

DASHBOARD:
  TYPE: "{{ IOS_DASHBOARD_TYPE }}" # primary | gallery

DISCOVERY:
  TYPE: "{{ IOS_DISCOVERY_TYPE }}" # native | webview | none
  WEBVIEW:
    BASE_URL: "{{ IOS_DISCOVERY_WEBVIEW_BASE_URL }}"
    COURSE_DETAIL_TEMPLATE: "{{ IOS_DISCOVERY_WEBVIEW_COURSE_DETAIL_TEMPLATE }}"
    PROGRAM_DETAIL_TEMPLATE: "{{ IOS_DISCOVERY_WEBVIEW_PROGRAM_DETAIL_TEMPLATE }}"

PROGRAM:
  TYPE: "{{ IOS_PROGRAM_TYPE }}" # native | webview | none
  WEBVIEW:
    BASE_URL: "{{ IOS_PROGRAM_WEBVIEW_BASE_URL }}"
    COURSE_DETAIL_TEMPLATE: "{{ IOS_PROGRAM_WEBVIEW_COURSE_DETAIL_TEMPLATE }}"
    PROGRAM_DETAIL_TEMPLATE: "{{ IOS_PROGRAM_WEBVIEW_PROGRAM_DETAIL_TEMPLATE }}"

FIREBASE:
  ENABLED: {{ IOS_FIREBASE_ENABLED }}
  ANALYTICS_SOURCE: "{{ IOS_FIREBASE_ANALYTICS_SOURCE }}" # segment | firebase | none
  CLOUD_MESSAGING_ENABLED: {{ IOS_FIREBASE_CLOUD_MESSAGING_ENABLED }}
  API_KEY: "{{ IOS_FIREBASE_API_KEY }}"
  CLIENT_ID: "{{ IOS_FIREBASE_CLIENT_ID }}"
  GOOGLE_APP_ID: "{{ IOS_FIREBASE_GOOGLE_APP_ID }}"
  GCM_SENDER_ID: "{{ IOS_FIREBASE_GCM_SENDER_ID }}"
  PROJECT_ID: "{{ IOS_FIREBASE_PROJECT_ID }}"
  REVERSED_CLIENT_ID: "{{ IOS_FIREBASE_REVERSED_CLIENT_ID }}"

SEGMENT_IO:
  ENABLED: {{ IOS_SEGMENT_IO_ENABLED }}
  SEGMENT_IO_WRITE_KEY: "{{ IOS_SEGMENT_IO_WRITE_KEY }}"

BRAZE:
  ENABLED: {{ IOS_BRAZE_ENABLED }}
  PUSH_NOTIFICATIONS_ENABLED: {{ IOS_BRAZE_PUSH_NOTIFICATIONS_ENABLED }}

BRANCH:
  ENABLED: {{ IOS_BRANCH_ENABLED }}
  KEY: "{{ IOS_BRANCH_KEY }}"
  URI_SCHEME: "{{ IOS_BRANCH_URI_SCHEME }}"
  DEEPLINK_PREFIX: "{{ IOS_BRANCH_DEEPLINK_PREFIX }}"

GOOGLE:
  ENABLED: {{ IOS_GOOGLE_ENABLED }}
  CLIENT_ID: "{{ IOS_GOOGLE_CLIENT_ID }}"
  GOOGLE_PLUS_KEY: "{{ IOS_GOOGLE_PLUS_KEY }}"

MICROSOFT:
  ENABLED: {{ IOS_MICROSOFT_ENABLED }}
  CLIENT_ID: "{{ IOS_MICROSOFT_CLIENT_ID }}"

FACEBOOK:
  ENABLED: {{ IOS_FACEBOOK_ENABLED }}
  FACEBOOK_APP_ID: "{{ IOS_FACEBOOK_APP_ID }}"
  CLIENT_TOKEN: "{{ IOS_FACEBOOK_CLIENT_TOKEN }}"

APPLE_SIGNIN:
  ENABLED: {{ IOS_APPLE_SIGNIN_ENABLED }}

# Custom values appended by other Tutor plugins. process_config.py loads this
# file with PyYAML, which keeps the last value when a key is duplicated, so this
# patch can also be used to override any of the values defined above.
{{ patch("ios-config-yaml") }}
