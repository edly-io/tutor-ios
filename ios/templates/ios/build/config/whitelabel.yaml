# Open edX iOS app white-labelling configuration, generated by the tutor-ios plugin.
#
# This file is consumed by the app's own config_script/whitelabel.py, which
# rewrites the Xcode project and asset catalogue in place:
#
#     python3 config_script/whitelabel.py --config-file whitelabel.yaml
#
# Unlike config.yaml, which is read at build time, these changes are written
# into the checkout itself. Re-running is safe and idempotent.
{% if IOS_IMAGES_IMPORT_DIR %}
images_import_dir: '{{ IOS_IMAGES_IMPORT_DIR }}'
{% endif %}
project_config:
  project_path: 'OpenEdX.xcodeproj/project.pbxproj'
{% if IOS_DEV_TEAM %}
  dev_team: '{{ IOS_DEV_TEAM }}'
  # The development team must also be set on each sub-project target.
  project_extra_targets: {{ IOS_EXTRA_TARGETS }}
{% endif %}
  marketing_version: '{{ IOS_MARKETING_VERSION }}'
  current_project_version: '{{ IOS_BUILD_NUMBER }}'
  configurations:
    # All three environments are mapped to the generated "prod" configuration,
    # matching config_settings.yaml, so any scheme targets this platform.
    DebugDev:
      app_bundle_id: '{{ IOS_BUNDLE_ID }}'
      product_name: '{{ IOS_APP_NAME }}'
      env_config: 'dev'
    ReleaseDev:
      app_bundle_id: '{{ IOS_BUNDLE_ID }}'
      product_name: '{{ IOS_APP_NAME }}'
      env_config: 'dev'
    DebugStage:
      app_bundle_id: '{{ IOS_BUNDLE_ID }}'
      product_name: '{{ IOS_APP_NAME }}'
      env_config: 'stage'
    ReleaseStage:
      app_bundle_id: '{{ IOS_BUNDLE_ID }}'
      product_name: '{{ IOS_APP_NAME }}'
      env_config: 'stage'
    DebugProd:
      app_bundle_id: '{{ IOS_BUNDLE_ID }}'
      product_name: '{{ IOS_APP_NAME }}'
      env_config: 'prod'
    ReleaseProd:
      app_bundle_id: '{{ IOS_BUNDLE_ID }}'
      product_name: '{{ IOS_APP_NAME }}'
      env_config: 'prod'
{% if IOS_COLORS or IOS_IMAGES or IOS_APP_ICON %}
assets:
  Theme:
    colors_path: 'Theme/Theme/Assets.xcassets/Colors'
    images_path: 'Theme/Theme/Assets.xcassets'
    icon_path: 'Theme/Assets.xcassets'
{% if IOS_COLORS %}
    colors:
{% for name, value in IOS_COLORS.items() %}
      {{ name }}:
{% if value is mapping %}
{% if value.light %}
        light: '{{ value.light }}'
{% endif %}
{% if value.dark %}
        dark: '{{ value.dark }}'
{% endif %}
{% else %}
        light: '{{ value }}'
        dark: '{{ value }}'
{% endif %}
{% endfor %}
{% endif %}
{% if IOS_IMAGES %}
    images:
{% for name, filename in IOS_IMAGES.items() %}
      {{ name }}:
        image_name: '{{ filename }}'
{% endfor %}
{% endif %}
{% if IOS_APP_ICON %}
    icon:
      AppIcon:
        image_name: '{{ IOS_APP_ICON }}'
{% endif %}
{% endif %}
{% if IOS_FONT_FILE %}
font:
  font_import_file_path: '{{ IOS_FONT_FILE }}'
  project_font_file_path: 'Theme/Theme/Fonts/SFPro.ttf'
  project_font_names_json_path: 'Theme/Theme/Fonts/fonts.json'
{% if IOS_FONT_NAMES %}
  font_names:
{% for style, name in IOS_FONT_NAMES.items() %}
    {{ style }}: '{{ name }}'
{% endfor %}
{% endif %}
{% endif %}

# Custom values appended by other Tutor plugins.
{{ patch("ios-whitelabel-yaml") }}
